<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street View Pinboard Canvas v1.2</title>
  <style>
    :root {
      --bg-color: #121316;
      --grid-color: rgba(255, 255, 255, 0.06);
      --card-bg: #1e2025;
      --accent-color: #22c55e;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    header {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(30, 32, 37, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1); padding: 8px 22px;
      border-radius: 9999px; display: flex; align-items: center; gap: 16px;
      z-index: 1000; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .status-badge { font-size: 13px; color: var(--text-sub); }
    .status-badge b { color: var(--accent-color); }
    .btn-reset-view {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main); padding: 4px 10px; border-radius: 6px; font-size: 12px;
      cursor: pointer; transition: background 0.15s ease;
    }
    .btn-reset-view:hover { background: rgba(255, 255, 255, 0.15); }
    #viewport { position: absolute; inset: 0; cursor: grab; overflow: hidden; }
    #viewport.panning { cursor: grabbing; }
    #grid-bg {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: 0; height: 0; }
    .snap-card {
      position: absolute; background: var(--card-bg); border-radius: 12px; padding: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 2px solid transparent;
      transition: border-color 0.15s ease, box-shadow 0.15s ease; cursor: grab;
      width: 320px; display: flex; flex-direction: column; gap: 8px;
    }
    .snap-card:hover, .snap-card.dragging { border-color: var(--accent-color); }
    .snap-card.dragging { cursor: grabbing; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); }
    .snap-card img { width: 100%; height: auto; border-radius: 8px; pointer-events: none; display: block; }
    .card-footer { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 2px; }
    .card-note {
        font-size: 0.9rem; color: var(--text-main); word-break: break-word; flex-grow: 1;
        cursor: text; user-select: text; padding: 3px 6px; border-radius: 4px; transition: background .15s ease;
    }
    .card-note:hover { background: rgba(255,255,255,0.05); }
    .card-actions { display: flex; align-items: center; gap: 6px; }
    .btn-action { background: none; border: none; font-size: 14px; padding: 4px; border-radius: 4px; cursor: pointer; }
    .btn-copy-slack {
        background: #007aff; color: #ffffff; padding: 7px 10px; border-radius: 6px; font-size: 12px;
        font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;
        transition: all 0.15s ease;
    }
    .btn-copy-slack:hover { background: #0063cc; }
    .btn-copy-slack.copied { background: var(--accent-color); color: #000; }
    .btn-delete { color: var(--text-sub); }
    .btn-delete:hover { color: #ef4444; background: rgba(239, 68, 68, 0.15); }
    #empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: var(--text-sub); pointer-events: none;
    }
    #empty-state h2 { font-size: 20px; margin-bottom: 8px; color: var(--text-main); }
    #toast {
        position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
        background: #10b981; color: white; padding: 10px 20px; border-radius: 8px;
        font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        opacity: 0; pointer-events: none; transition: all 0.2s ease; z-index: 2000;
    }
    #toast.show { opacity: 1; transform: translate(-50%, -8px); }
  </style>
</head>
<body>
  <header>
    <div class="status-badge">📸 <b>Ctrl+V</b> to Paste | 🖱️ <b>Drag</b> to Pan | 📜 <b>Scroll</b> to Zoom</div>
    <button class="btn-reset-view" id="btn-reset">Reset View</button>
  </header>

  <div id="viewport">
    <div id="grid-bg"></div>
    <div id="world">
      <div id="empty-state">
        <h2>Empty Pinboard Canvas</h2>
        <p>Take a snapshot in Street View and press Ctrl+V to paste.</p>
      </div>
    </div>
  </div>
  
  <div id="toast">Copied to clipboard!</div>

  <script>
    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const gridBg = document.getElementById('grid-bg');
    const emptyState = document.getElementById('empty-state');
    const btnReset = document.getElementById('btn-reset');
    const toast = document.getElementById('toast');

    let scale = 1, panX = 0, panY = 0;
    const MIN_SCALE = 0.15, MAX_SCALE = 4.0;
    let isPanning = false, startX = 0, startY = 0;

    function updateTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      gridBg.style.backgroundPosition = `${panX}px ${panY}px`;
      gridBg.style.backgroundSize = `${32 * scale}px ${32 * scale}px`;
    }

    viewport.addEventListener('mousedown', (e) => {
      if (e.target === viewport || e.target === gridBg || e.button === 1) {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.classList.add('panning');
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });
    window.addEventListener('mouseup', () => {
      isPanning = false;
      viewport.classList.remove('panning');
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.min(Math.max(scale * zoomFactor, MIN_SCALE), MAX_SCALE);
      if (newScale === scale) return;
      const mouseX = e.clientX, mouseY = e.clientY;
      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    btnReset.addEventListener('click', () => {
      scale = 1; panX = 0; panY = 0;
      updateTransform();
    });
    
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    let pasteIndex = 0;
    window.addEventListener('paste', (e) => {
      e.preventDefault();
      let imageFile = null;
      let textUrl = '';
      const onTextRead = (text) => {
        if (text.startsWith('http')) textUrl = text;
        if (imageFile) createCardFromPaste(imageFile, textUrl);
      };
      
      const items = e.clipboardData.items;
      let hasText = false;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) imageFile = items[i].getAsFile();
        if (items[i].type === 'text/plain') {
          hasText = true;
          items[i].getAsString(onTextRead);
        }
      }
      if (imageFile && !hasText) createCardFromPaste(imageFile, '');
    });
    
    function createCardFromPaste(file, note) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const spawnX = (window.innerWidth / 2 - panX) / scale - 160 + (pasteIndex * 25);
            const spawnY = (window.innerHeight / 2 - panY) / scale - 120 + (pasteIndex * 25);
            pasteIndex = (pasteIndex + 1) % 8;
            createImageCard(event.target.result, note || "Pasted Image", spawnX, spawnY);
        };
        reader.readAsDataURL(file);
    }

    function createImageCard(imageSrc, note, x, y) {
      if (emptyState) emptyState.style.display = 'none';

      const cardId = `card-${Date.now()}`;
      const card = document.createElement('div');
      card.className = 'snap-card';
      card.id = cardId;
      card.style.left = `${x}px`;
      card.style.top = `${y}px`;
      card.dataset.note = note;
      card.dataset.img = imageSrc;

      card.innerHTML = `
        <img src="${imageSrc}" alt="Snapshot" />
        <div class="card-footer">
          <div class="card-note" title="Double-click to edit note">${note}</div>
          <div class="card-actions">
            <button class="btn-copy-slack" title="Copy Image & Note for Slack">📋 Copy</button>
            <button class="btn-action btn-delete" title="Delete card">✕</button>
          </div>
        </div>`;

      card.querySelector('.btn-copy-slack').addEventListener('click', (e) => {
        e.stopPropagation();
        copyCardToClipboardForSlack(card);
      });
      card.querySelector('.btn-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        card.remove();
        if (world.querySelectorAll('.snap-card').length === 0) emptyState.style.display = 'block';
      });
      
      const noteEl = card.querySelector('.card-note');
      noteEl.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        const currentNote = card.dataset.note;
        const newNote = prompt("Edit note:", currentNote);
        if (newNote !== null) {
            card.dataset.note = newNote;
            noteEl.textContent = newNote;
        }
      });
      
      makeDraggableInWorld(card, x, y);
      world.appendChild(card);
    }

    function dataUrlToBlob(dataUrl) {
        return new Promise(resolve => {
            const img = new Image();
            img.src = dataUrl;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(blob => resolve(blob), 'image/png');
            };
        });
    }

    async function copyCardToClipboardForSlack(cardElement) {
        try {
            const imageBlob = await dataUrlToBlob(cardElement.dataset.img);
            const textBlob = new Blob([cardElement.dataset.note], { type: 'text/plain' });
            
            const item = new ClipboardItem({ 'image/png': imageBlob, 'text/plain': textBlob });
            await navigator.clipboard.write([item]);
            
            const btn = cardElement.querySelector('.btn-copy-slack');
            btn.classList.add('copied');
            btn.innerHTML = '✅ Copied!';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '📋 Copy';
            }, 2000);
        } catch (err) {
            console.error('Failed to copy to clipboard:', err);
            showToast('⚠️ Copy failed. Check browser permissions.');
        }
    }

    function makeDraggableInWorld(element, initX, initY) {
      let isDragging = false;
      let startMouseX, startMouseY, cardInitX = initX, cardInitY = initY;

      element.addEventListener('mousedown', (e) => {
        if (e.target.matches('button, .card-note')) return;
        e.stopPropagation();
        isDragging = true;
        element.classList.add('dragging');
        startMouseX = e.clientX;
        startMouseY = e.clientY;
        
        const onMouseMove = (moveEvent) => {
          if (!isDragging) return;
          const deltaX = (moveEvent.clientX - startMouseX) / scale;
          const deltaY = (moveEvent.clientY - startMouseY) / scale;
          element.style.left = `${cardInitX + deltaX}px`;
          element.style.top = `${cardInitY + deltaY}px`;
        };
        const onMouseUp = (upEvent) => {
          isDragging = false;
          element.classList.remove('dragging');
          cardInitX += (upEvent.clientX - startMouseX) / scale;
          cardInitY += (upEvent.clientY - startMouseY) / scale;
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }
    updateTransform();
  </script>
</body>
</html>
