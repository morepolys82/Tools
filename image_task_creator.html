<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager with Image Attachments</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 { margin: 0; font-size: 1.5rem; }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .full-width { grid-column: span 2; }

    input, select, button {
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }

    .btn-sync { background-color: #10b981; }

    ul { list-style: none; padding: 0; margin: 0; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .task-thumb {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      background-color: #f9fafb;
    }

    .task-info { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
    .task-desc { font-weight: 600; }
    .task-meta { font-size: 0.85rem; color: #6b7280; }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-Pending { background: #fef3c7; color: #92400e; }
    .badge-In-Progress { background: #dbeafe; color: #1e40af; }
    .badge-Completed { background: #d1fae5; color: #065f46; }

    .delete-btn {
      background: transparent;
      color: #ef4444;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    #sync-status {
      font-size: 0.85rem;
      margin-top: 8px;
      text-align: right;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Task Manager 1</h1>
      <button class="btn-sync" id="sync-btn" onclick="syncTasks()">Sync to Sheets</button>
    </header>

    <form id="task-form" onsubmit="addTask(event)">
      <input type="text" id="desc" class="full-width" placeholder="Task Description" required>
      <input type="datetime-local" id="datetime" required>
      <select id="status">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>
      <div class="full-width">
        <label style="font-size: 0.85rem; color: #6b7280; display: block; margin-bottom: 4px;">Attach Image (Optional):</label>
        <input type="file" id="image-input" accept="image/*" style="width: 100%; box-sizing: border-box;">
      </div>
      <button type="submit" class="full-width">Add Task</button>
    </form>

    <div id="sync-status">Ready</div>

    <ul id="task-list"></ul>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/a/macros/ea.com/s/AKfycbyfsmJ82VJ676Aq-0pkrVHStwOwgROSLCKMSr2qFsOn0Tx7lNIZcWSiIYp56NaHg5A/exec';

    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    function saveAndRender() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById('task-list');
      list.innerHTML = '';

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item';
        
        const formattedDate = new Date(task.dateTime).toLocaleString();
        const statusClass = task.status.replace(" ", "-");
        
        // Placeholder SVG if no image attached
        const imgSrc = task.imageBase64 ? task.imageBase64 : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="%239ca3af" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

        li.innerHTML = `
          <img class="task-thumb" src="${imgSrc}" alt="Thumbnail">
          <div class="task-info">
            <span class="task-desc">${escapeHtml(task.description)}</span>
            <span class="task-meta">📅 ${formattedDate}</span>
          </div>
          <div>
            <span class="badge badge-${statusClass}">${task.status}</span>
            <button class="delete-btn" onclick="deleteTask('${task.id}')">&times;</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    async function addTask(e) {
      e.preventDefault();
      const desc = document.getElementById('desc').value;
      const dateTime = document.getElementById('datetime').value;
      const status = document.getElementById('status').value;
      const imageFile = document.getElementById('image-input').files[0];

      let imageBase64 = null;

      if (imageFile) {
        // Automatically compresses image to max 800px width/height before saving
        imageBase64 = await compressImage(imageFile, 800, 0.7);
      }

      const newTask = {
        id: Date.now().toString(),
        description: desc,
        dateTime: dateTime,
        status: status,
        imageBase64: imageBase64
      };

      tasks.push(newTask);
      saveAndRender();

      document.getElementById('task-form').reset();
    }

    /**
     * CLIENT-SIDE IMAGE COMPRESSION
     * Resizes large images to fit max dimensions and applies JPEG compression
     */
    function compressImage(file, maxDimension = 800, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            // Scale down proportional to maxDimension
            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Export as compressed JPEG base64 string
            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveAndRender();
    }

    async function syncTasks() {
      const statusEl = document.getElementById('sync-status');
      const syncBtn = document.getElementById('sync-btn');

      if (tasks.length === 0) {
        statusEl.innerText = 'No new tasks to sync.';
        return;
      }

      if (GOOGLE_SCRIPT_URL === 'YOUR_WEB_APP_URL_HERE') {
        alert('Please update the GOOGLE_SCRIPT_URL in your script code.');
        return;
      }

      statusEl.innerText = 'Syncing tasks & uploading images...';
      syncBtn.disabled = true;

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ tasks: tasks })
        });

        const result = await response.json();

        if (result.status === 'success') {
          statusEl.innerText = 'Appended with images successfully at ' + new Date().toLocaleTimeString();
          tasks = []; // Clear local queue after successful push
          saveAndRender();
        } else {
          statusEl.innerText = 'Sync failed: ' + result.message;
        }
      } catch (err) {
        statusEl.innerText = 'Error connecting to Google Sheets.';
        console.error(err);
      } finally {
        syncBtn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    renderTasks();
  </script>
</body>
</html>
