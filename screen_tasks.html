<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Visual Scratchpad - Layered Markup & Excel Export</title>
  
  <!-- ExcelJS & FileSaver for Client-Side Spreadsheet Generation with Embedded Images -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f8fafc; }

    /* Top Floating Header */
    #toolbar {
      position: fixed; top: 16px; left: 16px; z-index: 100;
      display: flex; align-items: center; gap: 12px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(8px);
      padding: 8px 16px; border-radius: 10px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .badge { background: #3b82f6; color: white; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.5px; }
    .shortcuts { font-size: 0.8rem; color: #cbd5e1; display: flex; gap: 12px; }
    .shortcuts kbd { background: #1e293b; border: 1px solid #475569; padding: 2px 6px; border-radius: 4px; font-family: inherit; font-weight: 600; color: #f8fafc; }
    
    .btn-header { background: #10b981; border: none; color: white; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; transition: background 0.15s ease; display: flex; align-items: center; gap: 6px; }
    .btn-header:hover { background: #059669; }
    .btn-danger { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; transition: background 0.15s ease; }
    .btn-danger:hover { background: #dc2626; }

    /* Toast Notification */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #10b981; color: white; padding: 10px 20px; border-radius: 8px;
      font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 2000;
    }
    #toast.show { opacity: 1; transform: translate(-50%, -8px); }

    /* Infinite Canvas Viewport */
    #viewport { width: 100vw; height: 100vh; position: relative; cursor: grab; }
    #viewport.panning { cursor: grabbing; }
    #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: 0; height: 0; }

    /* Task Cards */
    .card {
      position: absolute; background: #1e293b; border: 2px solid #334155; border-radius: 10px;
      padding: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); cursor: move; display: flex; flex-direction: column;
      width: max-content; max-width: 480px; transition: opacity 0.15s ease, filter 0.15s ease, border-color 0.15s ease;
    }
    .card.selected { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4), 0 10px 25px rgba(0,0,0,0.6); }
    .card.done { opacity: 0.45; filter: grayscale(0.8); }
    .card img { max-width: 100%; max-height: 320px; border-radius: 6px; border: 1px solid #334155; pointer-events: none; }
    .card-footer { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    .card-note { font-size: 0.95rem; font-weight: 600; word-break: break-word; margin-right: 12px; cursor: text; user-select: text; border-radius: 4px; padding: 2px 4px; transition: background 0.15s; }
    .card-note:hover { background: rgba(255,255,255,0.06); }
    .card-meta { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }
    .card-actions { display: flex; gap: 6px; align-items: center; }
    .card-actions input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    
    .btn-action { background: none; border: none; color: #94a3b8; padding: 3px 6px; font-size: 0.85rem; cursor: pointer; border-radius: 4px; }
    .btn-action:hover { background: rgba(255,255,255,0.1); color: #f8fafc; }
    .btn-copy { color: #60a5fa; font-weight: 600; }
    .btn-copy:hover { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
    .btn-delete { color: #ef4444; }
    .btn-delete:hover { background: rgba(239, 68, 68, 0.2); }

    /* Paste Guide Banner */
    #empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: #64748b; pointer-events: none;
    }
    #empty-state h2 { font-size: 1.3rem; margin-bottom: 8px; color: #94a3b8; }

    /* ==========================================
       🎨 LAYERED MARKUP MODAL
       ========================================== */
    #markup-modal {
      position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px); display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #markup-modal.active { display: flex; }
    
    #markup-toolbar {
      display: flex; gap: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 8px;
      padding: 8px 14px; margin-bottom: 12px; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      max-width: 95vw; flex-wrap: wrap; justify-content: center;
    }
    .tool-btn { background: #334155; border: 1px solid #475569; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
    .tool-btn.active { background: #3b82f6; border-color: #60a5fa; }
    .tool-btn.eraser.active { background: #f59e0b; border-color: #fbbf24; }
    
    #modal-note-input {
      background: #0f172a; border: 1px solid #475569; color: white; padding: 6px 10px;
      border-radius: 6px; font-size: 0.85rem; width: 220px; outline: none;
    }
    #modal-note-input:focus { border-color: #3b82f6; }

    .save-btn { background: #10b981; border: none; color: white; padding: 6px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .cancel-btn { background: #64748b; border: none; color: white; padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    
    /* Dual-Canvas Layer Stack */
    #canvas-container {
      position: relative; max-width: 90vw; max-height: 75vh; overflow: auto;
      border: 2px solid #334155; border-radius: 8px; background: #0b0f19;
    }
    #canvas-wrapper { position: relative; display: inline-block; }
    #base-canvas { display: block; }
    #drawing-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
    #drawing-canvas.eraser-mode { cursor: cell; }
  </style>
</head>
<body>

  <!-- Controls -->
  <div id="toolbar">
    <span class="badge">SCRATCHPAD</span>
    <div class="shortcuts">
      <span>Snip: <kbd>Win+Shift+S</kbd> / <kbd>Cmd+Shift+4</kbd></span>
      <span>Paste: <kbd>Ctrl+V</kbd></span>
      <span>Copy for Slack: <kbd>Select + Ctrl+C</kbd></span>
      <span>Edit Note: <kbd>Double-Click</kbd></span>
    </div>
    <button class="btn-header" id="btn-export" onclick="exportToExcelSheet()">📊 Export for Google Sheets (.xlsx)</button>
    <button class="btn-danger" onclick="clearCanvas()">🗑️ Clear All</button>
  </div>

  <!-- Toast Notification -->
  <div id="toast">📋 Copied Image & Note to Clipboard! Ready for Slack.</div>

  <!-- Canvas Surface -->
  <div id="viewport">
    <div id="empty-state">
      <h2>📌 Canvas is empty</h2>
      <p>Snip any screen region, then press <b>Ctrl + V</b> anywhere here to mark it up and add a note.</p>
    </div>
    <div id="world"></div>
  </div>

  <!-- Interactive Layered Markup Modal -->
  <div id="markup-modal">
    <div id="markup-toolbar">
      <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')">✏️ Pen</button>
      <button class="tool-btn" id="tool-arrow" onclick="setTool('arrow')">↗️ Arrow</button>
      <button class="tool-btn" id="tool-rect" onclick="setTool('rect')">🔲 Box</button>
      <button class="tool-btn eraser" id="tool-eraser" onclick="setTool('eraser')" title="Click or drag over drawings to remove them">🧹 Eraser</button>
      
      <span style="color: #64748b;">|</span>
      
      <input type="color" id="draw-color" value="#ef4444" title="Color" style="cursor: pointer; border: none; width: 28px; height: 28px; border-radius: 4px; background: none;">
      <select id="draw-width" style="background: #334155; color: white; border: 1px solid #475569; padding: 4px 6px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;">
        <option value="2">Thin (2px)</option>
        <option value="4" selected>Medium (4px)</option>
        <option value="8">Thick (8px)</option>
      </select>
      
      <span style="color: #64748b;">|</span>
      
      <button class="tool-btn" onclick="undoMarkup()" title="Undo last shape">↩️ Undo</button>
      <button class="tool-btn" onclick="clearAllDrawings()" title="Clear all drawings from this image">🗑️ Clear Markups</button>
      
      <span style="color: #64748b;">|</span>

      <input type="text" id="modal-note-input" placeholder="Task / Note description..." title="Edit note attached to this screenshot">

      <button class="save-btn" onclick="saveMarkupAndFinish()">💾 Save Changes</button>
      <button class="cancel-btn" onclick="closeMarkupModal()">Cancel</button>
    </div>

    <!-- Dual Canvas Layers -->
    <div id="canvas-container">
      <div id="canvas-wrapper">
        <canvas id="base-canvas"></canvas>
        <canvas id="drawing-canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 🌌 1. PAN & ZOOM ENGINE
    // ==========================================
    const viewport = document.getElementById('viewport');
    const world = document.getElementById('world');
    const emptyState = document.getElementById('empty-state');
    const toast = document.getElementById('toast');

    let panX = window.innerWidth / 2;
    let panY = window.innerHeight / 2;
    let scale = 1;
    let isPanning = false;
    let startX, startY;
    let selectedCardId = null;

    function showToast(msg) {
      if (msg) toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function updateTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }
    updateTransform();

    viewport.addEventListener('mousedown', (e) => {
      if (e.target === viewport || e.target === world) {
        selectCard(null);
      }

      if (e.button === 2 || e.button === 1 || (e.button === 0 && e.target === viewport)) {
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.classList.add('panning');
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isPanning = false;
      viewport.classList.remove('panning');
    });

    viewport.addEventListener('contextmenu', e => e.preventDefault());

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      panX = mouseX - (mouseX - panX) * zoomFactor;
      panY = mouseY - (mouseY - panY) * zoomFactor;
      scale *= zoomFactor;
      updateTransform();
    }, { passive: false });

    // ==========================================
    // 🎨 2. LAYERED VECTOR DRAWING ENGINE
    // ==========================================
    const markupModal = document.getElementById('markup-modal');
    const baseCanvas = document.getElementById('base-canvas');
    const baseCtx = baseCanvas.getContext('2d');
    const drawingCanvas = document.getElementById('drawing-canvas');
    const drawCtx = drawingCanvas.getContext('2d');
    const modalNoteInput = document.getElementById('modal-note-input');

    let currentTool = 'pen';
    let isDrawing = false;
    let currentShape = null;
    let currentShapesList = []; // Vector shapes on drawing layer
    let rawBaseImageSrc = null;  // Original unblemished screenshot
    let editingCardId = null;

    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#markup-toolbar .tool-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tool-${tool}`);
      if (activeBtn) activeBtn.classList.add('active');
      
      drawingCanvas.classList.toggle('eraser-mode', tool === 'eraser');
    }

    function openMarkupModal(originalBaseImg, existingShapes = [], noteText = "", cardId = null) {
      editingCardId = cardId;
      rawBaseImageSrc = originalBaseImg;
      currentShapesList = JSON.parse(JSON.stringify(existingShapes));
      modalNoteInput.value = noteText;

      const img = new Image();
      img.src = originalBaseImg;
      img.onload = () => {
        baseCanvas.width = img.width;
        baseCanvas.height = img.height;
        drawingCanvas.width = img.width;
        drawingCanvas.height = img.height;

        // Render base screenshot layer
        baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
        baseCtx.drawImage(img, 0, 0);

        // Render vector drawing layer
        redrawVectorLayer();
        markupModal.classList.add('active');
      };
    }

    function redrawVectorLayer() {
      drawCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
      currentShapesList.forEach(shape => drawSingleShape(drawCtx, shape));
    }

    function drawSingleShape(ctx, shape) {
      ctx.strokeStyle = shape.color;
      ctx.lineWidth = shape.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (shape.type === 'pen') {
        if (shape.points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(shape.points[0].x, shape.points[0].y);
        for (let i = 1; i < shape.points.length; i++) {
          ctx.lineTo(shape.points[i].x, shape.points[i].y);
        }
        ctx.stroke();
      } else if (shape.type === 'rect') {
        ctx.strokeRect(shape.x, shape.y, shape.w, shape.h);
      } else if (shape.type === 'arrow') {
        drawArrow(shape.x1, shape.y1, shape.x2, shape.y2, ctx, shape.width, shape.color);
      }
    }

    function drawArrow(fromx, fromy, tox, toy, ctx, width, color) {
      const headlen = width * 4 + 8;
      const angle = Math.atan2(toy - fromy, tox - fromx);
      ctx.beginPath();
      ctx.moveTo(fromx, fromy);
      ctx.lineTo(tox, toy);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(tox, toy);
      ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function undoMarkup() {
      if (currentShapesList.length > 0) {
        currentShapesList.pop();
        redrawVectorLayer();
      }
    }

    function clearAllDrawings() {
      currentShapesList = [];
      redrawVectorLayer();
    }

    function closeMarkupModal() {
      markupModal.classList.remove('active');
      editingCardId = null;
    }

    function getCanvasCoords(e) {
      const rect = drawingCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (drawingCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (drawingCanvas.height / rect.height)
      };
    }

    function eraseAtPoint(x, y) {
      const threshold = 18;
      const initialCount = currentShapesList.length;
      
      currentShapesList = currentShapesList.filter(shape => {
        if (shape.type === 'pen') {
          return !shape.points.some(p => Math.hypot(p.x - x, p.y - y) < threshold);
        } else if (shape.type === 'rect') {
          const inX = x >= Math.min(shape.x, shape.x + shape.w) - threshold && x <= Math.max(shape.x, shape.x + shape.w) + threshold;
          const inY = y >= Math.min(shape.y, shape.y + shape.h) - threshold && y <= Math.max(shape.y, shape.y + shape.h) + threshold;
          return !(inX && inY);
        } else if (shape.type === 'arrow') {
          const d1 = Math.hypot(shape.x1 - x, shape.y1 - y);
          const d2 = Math.hypot(shape.x2 - x, shape.y2 - y);
          const lineLen = Math.hypot(shape.x2 - shape.x1, shape.y2 - shape.y1);
          return (d1 + d2) > (lineLen + threshold);
        }
        return true;
      });

      if (currentShapesList.length !== initialCount) {
        redrawVectorLayer();
      }
    }

    drawingCanvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const coords = getCanvasCoords(e);
      const color = document.getElementById('draw-color').value;
      const width = parseInt(document.getElementById('draw-width').value);

      if (currentTool === 'eraser') {
        eraseAtPoint(coords.x, coords.y);
      } else if (currentTool === 'pen') {
        currentShape = { type: 'pen', points: [coords], color, width };
      } else if (currentTool === 'rect') {
        currentShape = { type: 'rect', startX: coords.x, startY: coords.y, x: coords.x, y: coords.y, w: 0, h: 0, color, width };
      } else if (currentTool === 'arrow') {
        currentShape = { type: 'arrow', x1: coords.x, y1: coords.y, x2: coords.x, y2: coords.y, color, width };
      }
    });

    drawingCanvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const coords = getCanvasCoords(e);

      if (currentTool === 'eraser') {
        eraseAtPoint(coords.x, coords.y);
      } else if (currentTool === 'pen') {
        currentShape.points.push(coords);
        redrawVectorLayer();
        drawSingleShape(drawCtx, currentShape);
      } else if (currentTool === 'rect') {
        currentShape.x = Math.min(currentShape.startX, coords.x);
        currentShape.y = Math.min(currentShape.startY, coords.y);
        currentShape.w = Math.abs(coords.x - currentShape.startX);
        currentShape.h = Math.abs(coords.y - currentShape.startY);
        redrawVectorLayer();
        drawSingleShape(drawCtx, currentShape);
      } else if (currentTool === 'arrow') {
        currentShape.x2 = coords.x;
        currentShape.y2 = coords.y;
        redrawVectorLayer();
        drawSingleShape(drawCtx, currentShape);
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDrawing) {
        isDrawing = false;
        if (currentShape && currentTool !== 'eraser') {
          currentShapesList.push(currentShape);
          currentShape = null;
          redrawVectorLayer();
        }
      }
    });

    function generateMergedPreview() {
      const mergedCanvas = document.createElement('canvas');
      mergedCanvas.width = baseCanvas.width;
      mergedCanvas.height = baseCanvas.height;
      const mCtx = mergedCanvas.getContext('2d');
      mCtx.drawImage(baseCanvas, 0, 0);
      mCtx.drawImage(drawingCanvas, 0, 0);
      return mergedCanvas.toDataURL('image/png');
    }

    function saveMarkupAndFinish() {
      const mergedPreviewUrl = generateMergedPreview();
      const updatedNote = modalNoteInput.value.trim() || "Untitled Note";
      const targetCardId = editingCardId;

      closeMarkupModal();

      if (targetCardId) {
        // In-place update
        const card = cards.find(c => c.id === targetCardId);
        if (card) {
          card.img = mergedPreviewUrl;
          card.originalBaseImg = rawBaseImageSrc;
          card.shapes = JSON.parse(JSON.stringify(currentShapesList));
          card.note = updatedNote;
          
          const cardEl = document.getElementById(`card-${card.id}`);
          if (cardEl) {
            const imgEl = cardEl.querySelector('img');
            const noteEl = cardEl.querySelector('.card-note');
            if (imgEl) imgEl.src = mergedPreviewUrl;
            if (noteEl) noteEl.innerText = updatedNote;
          }
          saveCards();
          showToast("💾 Changes saved to card!");
        }
      } else {
        // New card creation
        createAndAddCard(mergedPreviewUrl, rawBaseImageSrc, currentShapesList, updatedNote);
      }
    }

    // ==========================================
    // 📋 3. MULTI-MIME SLACK CLIPBOARD EXPORT
    // ==========================================
    async function copyCardToClipboardForSlack(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;

      if (!window.isSecureContext || !navigator.clipboard || !window.ClipboardItem) {
        alert("⚠️ Image clipboard copy requires a local server due to browser security restrictions on file:/// paths.\n\nPlease open this file using VS Code Live Server (http://localhost:5500).");
        return;
      }

      try {
        const byteString = atob(card.img.split(',')[1]);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        const imageBlob = new Blob([ab], { type: 'image/png' });
        const textBlob = new Blob([card.note ? `📝 ${card.note}` : ''], { type: 'text/plain' });

        const clipboardItem = new ClipboardItem({
          'image/png': imageBlob,
          'text/plain': textBlob
        });

        await navigator.clipboard.write([clipboardItem]);
        showToast("📋 Copied image & note! Paste (Ctrl+V) directly into Slack.");
      } catch (err) {
        console.warn("Multi-mime copy failed, trying image-only copy:", err);
        try {
          const byteString = atob(card.img.split(',')[1]);
          const ab = new ArrayBuffer(byteString.length);
          const ia = new Uint8Array(ab);
          for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
          const imageBlob = new Blob([ab], { type: 'image/png' });

          await navigator.clipboard.write([new ClipboardItem({ 'image/png': imageBlob })]);
          showToast("📋 Copied image to clipboard! Ready for Slack.");
        } catch (fallbackErr) {
          console.error("Clipboard blocked:", fallbackErr);
          alert("Clipboard write failed: " + fallbackErr.message);
        }
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && selectedCardId) {
        if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          copyCardToClipboardForSlack(selectedCardId);
        }
      }
    });

    window.addEventListener('paste', (e) => {
      if (markupModal.classList.contains('active')) return;
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (const item of items) {
        if (item.type.indexOf('image') === 0) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (event) => openMarkupModal(event.target.result, [], "");
          reader.readAsDataURL(blob);
        }
      }
    });

    // ==========================================
    // 🗂️ 4. TASK CARD LOGIC & LOCAL STORAGE
    // ==========================================
    let cards = JSON.parse(localStorage.getItem('scratchpad_cards') || '[]');

    function selectCard(cardId) {
      selectedCardId = cardId;
      document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
      if (cardId) {
        const el = document.getElementById(`card-${cardId}`);
        if (el) el.classList.add('selected');
      }
    }

    function updateEmptyState() {
      emptyState.style.display = cards.length === 0 ? 'block' : 'none';
    }

    function createAndAddCard(mergedImg, originalBaseImg, shapes, note) {
      const spawnX = (-panX + (window.innerWidth / 2)) / scale - 160;
      const spawnY = (-panY + (window.innerHeight / 2)) / scale - 120;

      const newCard = {
        id: Date.now().toString(),
        img: mergedImg,
        originalBaseImg: originalBaseImg,
        shapes: shapes,
        note: note,
        timestamp: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        x: spawnX,
        y: spawnY,
        done: false
      };

      cards.push(newCard);
      saveCards();
      renderCard(newCard);
      selectCard(newCard.id);
      updateEmptyState();
    }

    function editCard(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;
      openMarkupModal(card.originalBaseImg || card.img, card.shapes || [], card.note, card.id);
    }

    function editNoteInline(cardId) {
      const card = cards.find(c => c.id === cardId);
      if (!card) return;
      const newNote = prompt("Edit Task / Note:", card.note);
      if (newNote !== null) {
        card.note = newNote.trim() || "Untitled Note";
        const noteEl = document.querySelector(`#card-${card.id} .card-note`);
        if (noteEl) noteEl.innerText = card.note;
        saveCards();
        showToast("📝 Note updated!");
      }
    }

    function renderCard(card) {
      const el = document.createElement('div');
      el.className = `card ${card.done ? 'done' : ''} ${selectedCardId === card.id ? 'selected' : ''}`;
      el.id = `card-${card.id}`;
      el.style.left = `${card.x}px`;
      el.style.top = `${card.y}px`;

      el.innerHTML = `
        <img src="${card.img}">
        <div class="card-footer">
          <div>
            <div class="card-note" title="Double-click to edit note" ondblclick="editNoteInline('${card.id}')">${card.note}</div>
            <div class="card-meta">${card.timestamp}</div>
          </div>
          <div class="card-actions">
            <button class="btn-action btn-copy" title="Copy Image & Note for Slack (Ctrl+C)" onclick="copyCardToClipboardForSlack('${card.id}')">📋 Slack</button>
            <button class="btn-action" title="Modify Screenshot & Markups" onclick="editCard('${card.id}')">✏️</button>
            <input type="checkbox" ${card.done ? 'checked' : ''} onchange="toggleDone('${card.id}')">
            <button class="btn-action btn-delete" title="Delete" onclick="deleteCard('${card.id}')">✕</button>
          </div>
        </div>
      `;

      // Drag card
      let isDragging = false, dragStartX, dragStartY;
      el.addEventListener('mousedown', (e) => {
        selectCard(card.id);
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.classList.contains('card-note')) return;
        isDragging = true;
        dragStartX = e.clientX - (card.x * scale);
        dragStartY = e.clientY - (card.y * scale);
        e.stopPropagation();
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        card.x = (e.clientX - dragStartX) / scale;
        card.y = (e.clientY - dragStartY) / scale;
        el.style.left = `${card.x}px`;
        el.style.top = `${card.y}px`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          saveCards();
        }
      });

      world.appendChild(el);
    }

    function toggleDone(id) {
      const card = cards.find(c => c.id === id);
      if (card) {
        card.done = !card.done;
        document.getElementById(`card-${id}`).classList.toggle('done');
        saveCards();
      }
    }

    function deleteCard(id) {
      cards = cards.filter(c => c.id !== id);
      document.getElementById(`card-${id}`).remove();
      if (selectedCardId === id) selectedCardId = null;
      saveCards();
      updateEmptyState();
    }

    function clearCanvas() {
      if (confirm("Clear all cards from canvas?")) {
        cards = [];
        world.innerHTML = '';
        selectedCardId = null;
        saveCards();
        updateEmptyState();
      }
    }

    function saveCards() {
      localStorage.setItem('scratchpad_cards', JSON.stringify(cards));
    }

    // ==========================================
    // 📊 5. EXCEL (.XLSX) EXPORT FOR GOOGLE SHEETS
    // ==========================================
    async function exportToExcelSheet() {
      if (cards.length === 0) {
        alert("Canvas is empty! Add some screenshots first.");
        return;
      }

      const btn = document.getElementById('btn-export');
      btn.innerText = "⏳ Generating File...";
      btn.disabled = true;

      try {
        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet('Scratchpad Tasks');

        worksheet.columns = [
          { header: 'Status', key: 'status', width: 14 },
          { header: 'Timestamp', key: 'timestamp', width: 22 },
          { header: 'Note / Task', key: 'note', width: 35 },
          { header: 'Screenshot Preview', key: 'preview', width: 32 }
        ];

        const headerRow = worksheet.getRow(1);
        headerRow.font = { bold: true, color: { argb: 'FFFFFF' } };
        headerRow.fill = {
          type: 'pattern',
          pattern: 'solid',
          fgColor: { argb: '1E293B' }
        };
        headerRow.height = 26;
        headerRow.alignment = { vertical: 'middle', horizontal: 'center' };

        for (let i = 0; i < cards.length; i++) {
          const card = cards[i];
          const rowIndex = i + 2;

          const row = worksheet.addRow({
            status: card.done ? "Done" : "Pending",
            timestamp: card.timestamp,
            note: card.note
          });

          row.height = 85;
          row.alignment = { vertical: 'middle', wrapText: true };

          const imageId = workbook.addImage({
            base64: card.img,
            extension: 'png',
          });

          worksheet.addImage(imageId, {
            tl: { col: 3.1, row: rowIndex - 0.9 },
            ext: { width: 180, height: 100 }
          });
        }

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        saveAs(blob, `Visual_Scratchpad_Export_${new Date().toISOString().slice(0, 10)}.xlsx`);

        showToast("✅ Spreadsheet downloaded! Ready for Google Drive import.");
      } catch (err) {
        console.error(err);
        alert("Error exporting spreadsheet: " + err.message);
      } finally {
        btn.innerText = "📊 Export for Google Sheets (.xlsx)";
        btn.disabled = false;
      }
    }

    // Initialize board on load
    cards.forEach(renderCard);
    updateEmptyState();
  </script>
</body>
</html>
